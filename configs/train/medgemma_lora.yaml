model:
  family: medgemma
  model_id: google/medgemma-4b-it
  torch_dtype: bfloat16
  attn_implementation: flash_attention_2
  trust_remote_code: true

method: lora

trainable:
  llm: true
  projector: false
  encoder: false

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: auto

data:
  root: data
  max_length: 4096
  # Main study: datasets: [pad]
  # 0 = image-only, 1 = observed context, (0, 1) = stochastic masking
  information_rate: 1.0

training:
  output_dir: outputs/medgemma-lora
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  num_train_epochs: 1
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  bf16: true
  gradient_checkpointing: true
  report_to: tensorboard
